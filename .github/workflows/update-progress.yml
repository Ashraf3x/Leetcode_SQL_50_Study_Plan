name: Update Progress and Cleanup

on:
  push:
    paths:
      - '**/*.sql'

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cleanup redundant files
        run: |
          find . -type f \( -name "README.md" -o -name "problem.yml" \) ! -path "./README.md" -delete

      - name: Update Progress
        run: |
          solved=$(find . -name "*.sql" | wc -l)
          total=50
          percentage=$((solved * 100 / total))
          
          echo "# 📈 Progress Tracker" > PROGRESS.md
          echo "" >> PROGRESS.md
          echo "**Solved: $solved / $total ($percentage%)**" >> PROGRESS.md
          echo "Last updated: $(date)" >> PROGRESS.md
          
          sed -i "s|Progress-[0-9]*%|Progress-$percentage%|g" README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update progress and cleanup files" || exit 0
          git push origin HEAD:${{ github.ref_name }}
