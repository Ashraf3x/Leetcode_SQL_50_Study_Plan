name: Check SQL Solutions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check SQL files exist
      run: |
        echo "Checking for SQL solution files..."
        find . -name "solution.sql" | wc -l
    
    - name: Validate YAML files
      run: |
        pip install pyyaml
        python -c "
import yaml
from pathlib import Path

for yml_file in Path('.').rglob('problem.yml'):
    try:
        with open(yml_file, 'r') as f:
            yaml.safe_load(f)
        print(f'✓ {yml_file}')
    except Exception as e:
        print(f'✗ {yml_file}: {e}')
        exit(1)
        "
    
    - name: Update Progress
      run: |
        pip install pyyaml
        python scripts/update_progress.py
